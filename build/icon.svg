<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- soft reflection floor -->
  <ellipse cx="512" cy="836" rx="330" ry="54" fill="url(#fade)"/>

  <!-- monitor -->
  <rect x="188" y="176" width="648" height="470" rx="60" fill="#000" stroke="url(#screen)" stroke-width="42"/>

  <!-- mirrored content inside screen: two symmetric halves -->
  <g opacity="0.95">
    <path d="M262 566 L262 396 L400 300 L470 396 L512 470 L554 396 L624 300 L762 396 L762 566 Z"
          fill="url(#screen)" opacity="0.20"/>
    <line x1="512" y1="252" x2="512" y2="580" stroke="url(#screen)" stroke-width="20" opacity="0.75"/>
    <path d="M512 470 L400 300" stroke="url(#screen)" stroke-width="16" opacity="0.55" fill="none"/>
    <path d="M512 470 L624 300" stroke="url(#screen)" stroke-width="16" opacity="0.55" fill="none"/>
  </g>

  <!-- stand -->
  <rect x="452" y="660" width="120" height="76" rx="10" fill="url(#screen)"/>
  <rect x="322" y="736" width="380" height="46" rx="23" fill="url(#screen)"/>
</svg>